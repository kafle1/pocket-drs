name: pocket_drs
description: "Pocket DRS: single-phone LBW review for cricket."
publish_to: 'none'

version: 2.1.1+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.0
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  http: ^1.2.2
  url_launcher: ^6.3.2
  camera: ^0.11.2+1
  camera_android: ^0.10.10+6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  firebase_analytics: ^13.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

# apply with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
